# fly.toml app configuration file generated for kingdomscout-scraper on 2026-02-06T12:48:23-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kingdomscout-scraper'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  LOG_LEVEL = 'INFO'
  SCRAPE_INTERVAL_HOURS = '4'

[processes]
  worker = 'python src/main.py --continuous --interval 4'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
